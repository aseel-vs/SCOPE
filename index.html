<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCOPE: Your browser, understood.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f5f5f7;--cd:#fff;--tx:#1d1d1f;--mu:#6e6e73;--bd:rgba(0,0,0,.08);--ac:#0071e3;--ac2:rgba(0,113,227,.1);--sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);--off:rgba(120,120,128,.32);--ok:#248a3d;--wn:#b25000;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--cd:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.12);--ac:#2997ff;--ac2:rgba(41,151,255,.16);--sh:none;--ok:#30d158;--wn:#ff9f0a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--cd:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.12);--ac:#2997ff;--ac2:rgba(41,151,255,.16);--sh:none;--ok:#30d158;--wn:#ff9f0a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:22px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--bd)}
.logo{font-weight:700;letter-spacing:.12em;padding:4px 12px 20px}
.logo small{display:block;letter-spacing:0;font-weight:400;color:var(--mu);font-size:12px;margin-top:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
nav a:hover{background:var(--ac2);color:var(--tx)}
nav a[aria-current="page"]{background:var(--ac2);color:var(--ac)}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding:30px clamp(16px,4vw,48px) 56px;max-width:1000px;width:100%}
h1{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:0}
h2{font-size:15px;font-weight:600;margin:0 0 12px}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.sub{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid .card{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats>div{padding:0 16px;border-left:1px solid var(--bd)}
.stats>div:first-child{border:0;padding-left:0}
.big{font-size:clamp(20px,6vw,30px);font-weight:600;letter-spacing:-.02em}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:2px}
.seg button{border:0;background:none;color:var(--mu);padding:5px 12px;border-radius:8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cd);color:var(--tx);box-shadow:var(--sh);outline:1px solid var(--bd)}
.seg button[disabled]{opacity:.5;cursor:default}
.btn,.chip{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:10px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,opacity .15s}
.btn:hover,.chip:hover{background:var(--ac2)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.p:hover{opacity:.9}
.btn.d{color:#d70015}
.btn[disabled]{opacity:.45;cursor:default}
.chip{border-radius:20px;padding:6px 12px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-bottom:20px}
.b{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.b i{width:100%;max-width:22px;background:var(--ac);border-radius:5px 5px 2px 2px;transition:height .4s}
.b em{position:absolute;bottom:-20px;font-style:normal;font-size:10px;color:var(--mu);white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.cut{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:6px;border-radius:3px;background:var(--bd);flex:1;overflow:hidden}
.track i{display:block;height:100%;background:var(--ac)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--bd)}
.set:first-of-type{border-top:0;padding-top:0}
.sw{flex:none;width:46px;height:28px;border-radius:14px;border:0;background:var(--off);position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.sw[aria-checked="true"]{background:#34c759}
.sw[aria-checked="true"]::after{left:20px}
.msg{max-width:90%;margin:10px 0;padding:10px 14px;border-radius:16px;background:var(--cd);border:1px solid var(--bd)}
.msg.u{margin-left:auto;background:var(--ac);border-color:var(--ac);color:#fff}
.msg p{margin:4px 0}
.tag{font-size:12px;font-weight:650;margin-right:8px;color:var(--ac)}
.tag.s{color:var(--ok)}
.tag.a{color:var(--wn)}
.tm{font-size:50px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:36px 16px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
@media(max-width:820px){
#app{display:block}
nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--bd);border-right:0;z-index:5;justify-content:space-around}
.logo{display:none}
nav a{flex:1;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;align-items:center}
main{padding-bottom:100px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><nav aria-label="Primary"></nav><main id="main"></main></div>
<script>
(()=>{

`<div class="card stats"><div><div class="sub">Active time today</div><div class="big">${fm(tot(T))}</div></div><div><div class="sub">Open tabs now</div><div class="big">${c.tabs}</div></div><div><div class="sub">Sites visited today</div><div class="big">${new Set(T.map(s=>s.domain)).size}</div></div></div>

<div class="card" style="margin-top:14px"><h2>Recent insights</h2>${ins.length?ins.map(i=>`<div class="row"><span>${esc(i.t)}</span></div>`).join(""):'<div class="sub">No new insights.</div>'}<a href="#insights" class="sub" style="display:inline-block;margin-top:6px">View all insights</a></div>`}
function vInsights(){const c=cur(),l=insights().slice(0,A.cfg.lim);return hdr("Insights","Suggestions based on domain-level statistics only.")+(l.length?l.map(insCard).join(""):`<div class="card empty"><b>${c.S.length?"You’re all caught up":"No insights yet"}</b><p>${c.S.length?"New insights appear as your browsing changes.":"Insights need browsing data. Use demo data or import your own in Settings."}</p></div>`)+`<div class="sub">Showing up to ${A.cfg.lim} insights. Change the limit in Settings.</div>`}

const cs=cats(S),all=tot(S),P=["#0a84ff","#5e5ce6","#30b0c7","#ff9f0a","#30d158","#8e8e93"],ses=[...S].sort((a,b)=>b.start-a.start).slice(0,8);
return hdr("Activity","Domain-level statistics.")+seg+
`<div class="card" style="margin-top:14px"><h2>${rng==1?"Today by hour":"Active minutes per day"}: ${fm(all)} in total</h2>${bars(v,l,"m")}</div>
<div class="grid"><div class="card"><h2>Categories</h2><div class="stack">${cs.map(([k,m],i)=>`<i style="flex:${m};background:${P[i%6]}" title="${k}"></i>`).join("")}</div><div style="margin-top:10px">${cs.map(([k,m],i)=>`<div class="row"><span><span class="dot" style="background:${P[i%6]}"></span>${k}</span><span class="sub" style="margin-left:auto">${Math.round(m/all*100)}%</span></div>`).join("")}</div></div>
<div class="card"><h2>Top domains</h2>${domRows(top(S).slice(0,8))}</div></div>
<div class="card" style="margin-top:14px"><h2>Recent sessions</h2>${ses.map(s=>`<div class="row"><span>${esc(s.domain)}</span><span class="sub" style="margin-left:auto">${new Date(s.start).toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"})}, ${fm(s.min)}</span></div>`).join("")}</div>`}
/* Focus timer */
const mmss=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const paint=()=>{const t=$("#tm"),r=$("#ring");if(t)t.textContent=mmss(F.left);if(r)r.style.strokeDashoffset=628.3*(1-F.left/(F.dur*60))};
function tick(){F.left=Math.max(0,Math.ceil((F.end-Date.now())/1000));paint();if(F.left<=0){clearInterval(F.id);F.run=0;A.foc.unshift({t:Date.now(),min:F.dur});A.foc=A.foc.slice(0,200);F.msg=A.cfg.brk?"Session complete. Take a 5-minute break and step away from the screen.":"Session complete.";F.left=F.dur*60;sv();render()}}
function vFocus(){const td=A.foc.filter(f=>f.t>=sod(Date.now())),started=F.left<F.dur*60;
return hdr("Focus","An optional timer. Nothing is tracked while it runs.",1)+
`<div class="grid"><div class="card" style="text-align:center"><div style="position:relative;width:220px;height:220px;margin:6px auto 18px"><svg viewBox="0 0 220 220" width="220" height="220" style="transform:rotate(-90deg)" aria-hidden="true"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--bd)" stroke-width="8"/><circle id="ring" cx="110" cy="110" r="100" fill="none" stroke="var(--ac)" stroke-width="8" stroke-linecap="round" stroke-dasharray="628.3" style="stroke-dashoffset:${628.3*(1-F.left/(F.dur*60))};transition:stroke-dashoffset .5s linear"/></svg><div id="tm" class="tm" role="timer" style="position:absolute;inset:0;display:grid;place-items:center">${mmss(F.left)}</div></div>
<div class="seg" role="group" aria-label="Session length">${[15,25,50].map(n=>`<button data-a="dur" data-v="${n}" aria-pressed="${F.dur==n}"${F.run?" disabled":""}>${n} min</button>`).join("")}</div>
<div style="margin-top:16px;display:flex;gap:8px;justify-content:center"><button class="btn p" data-a="${F.run?"pause":"start"}">${F.run?"Pause":started?"Resume":"Start"}</button><button class="btn" data-a="reset"${started||F.run?"":" disabled"}>Reset</button></div>
<p class="sub" aria-live="polite" style="min-height:22px;margin-top:12px">${esc(F.msg)}</p></div>
<div class="card"><h2>Today</h2><div class="big">${td.length} <span class="sub">session${td.length==1?"":"s"}, ${fm(td.reduce((a,f)=>a+f.min,0))}</span></div>
<div class="set" style="margin-top:12px"><div>Break reminders<div class="sub">Suggest a short break after each session</div></div><button class="sw" role="switch" aria-label="Break reminders" aria-checked="${A.cfg.brk}" data-a="brk"></button></div>
<h2 style="margin-top:6px">History</h2>${A.foc.length?A.foc.slice(0,6).map(f=>`<div class="row"><span>${f.min} minute session</span><span class="sub" style="margin-left:auto">${new Date(f.t).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</span></div>`).join(""):'<div class="sub">Completed sessions appear here.</div>'}</div></div>`}
const TG={d:["Your data","tag"],s:["Suggestion","tag s"],a:["Assumption","tag a"]},SUG=["How did I spend my browsing time today?","What websites did I visit most?","Give me a summary of my browsing habits.","How can I organize my tabs?","What should I improve about my browsing workflow?"];
function vAssistant(){return hdr("Assistant","Runs on this device with a local rules engine. No external AI.")+`<div id="log" aria-live="polite">${chat.length?"":'<div class="card empty"><b>Ask about your browsing</b><p>Every answer is labeled as your data, a suggestion or an assumption.</p></div>'}${chat.map(m=>m.u?`<div class="msg u">${esc(m.u)}</div>`:`<div class="msg">${m.b.map(([k,x])=>`<p><span class="${TG[k][1]}">${TG[k][0]}</span>${esc(x)}</p>`).join("")}</div>`).join("")}${busy?'<div class="msg"><span class="sub">Analyzing local data…</span></div>':""}</div>
<div style="margin:14px 0;display:flex;gap:8px;flex-wrap:wrap">${SUG.map(s=>`<button class="chip" data-a="ask" data-v="${s}">${s}</button>`).join("")}</div>
<div style="display:flex;gap:8px"><input id="q" aria-label="Ask SCOPE" placeholder="Ask about your browsing" style="flex:1" maxlength="200"><button class="btn p" data-a="send" aria-label="Send">${svg(ic.send)}</button></div>`}
function vPrefs(){const x=A.cfg,opt=(a,v,f)=>a.map(n=>`<option value="${n}"${n==v?" selected":""}>${f(n)}</option>`).join("");
return hdr("Settings","Everything is stored in this browser only.",1)+`<div class="card">
<div class="set"><div>Tracking<div class="sub">Saved as a preference. The Firefox extension is not part of this build, so nothing is being tracked.</div></div><button class="sw" role="switch" aria-label="Tracking" aria-checked="${x.track}" data-a="trk"></button></div>
<div class="set"><div>Appearance</div><div class="seg" role="group" aria-label="Appearance">${["system","light","dark"].map(n=>`<button data-a="theme" data-v="${n}" aria-pressed="${x.theme==n}">${n[0].toUpperCase()+n.slice(1)}</button>`).join("")}</div></div>
<div class="set"><div>Daily insights limit</div><select data-a="lim" aria-label="Daily insights limit">${opt([1,3,5,10],x.lim,n=>n)}</select></div>
<div class="set"><div>Data retention<div class="sub">Older sessions are hidden and removed from imported data</div></div><select data-a="ret" aria-label="Data retention">${opt([7,30,90,365],x.ret,n=>n+" days")}</select></div>
<div class="set" style="display:block"><div>Excluded domains<div class="sub">Left out of every chart, insight and answer</div></div><div style="display:flex;gap:8px;margin:10px 0"><input id="ex" aria-label="Domain to exclude" placeholder="example.com" style="flex:1"><button class="btn" data-a="addex">Add</button></div><div style="display:flex;gap:6px;flex-wrap:wrap">${x.ex.map(d=>`<span class="chip">${esc(d)} <button data-a="rmex" data-v="${esc(d)}" aria-label="Remove ${esc(d)}" style="border:0;background:none;color:var(--mu);cursor:pointer">×</button></span>`).join("")||'<span class="sub">None</span>'}</div></div></div>
<div class="card"><h2>Your data</h2>
<div class="set" style="display:block"><div>Import<div class="sub">A JSON file like <code>{"sessions":[{"domain":"github.com","start":1730000000000,"end":1730000900000}],"openTabs":12}</code>. Only domains, start times and durations are kept.</div></div><input id="imp" type="file" accept=".json,application/json" data-a="imp" style="margin-top:10px;max-width:100%"></div>
<div class="set"><div>Export personal data<div class="sub">Settings, focus history and imported sessions as JSON</div></div><button class="btn" data-a="exp">${exp?"Hide":"Show export"}</button></div>
${exp?`<textarea id="xp" readonly rows="8" aria-label="Exported data" style="width:100%;font:12px/1.4 ui-monospace,Menlo,monospace">${esc(exp)}</textarea><div style="margin:8px 0"><button class="btn" data-a="copy">Copy</button> <span class="sub" id="cp"></span></div>`:""}
<div class="set"><div>Clear all browsing data<div class="sub">Removes imported sessions, focus history and dismissed insights. Settings are kept.</div></div>${conf?'<span><button class="btn d" data-a="clr">Confirm</button> <button class="btn" data-a="nc">Cancel</button></span>':'<button class="btn d" data-a="ask2">Clear data</button>'}</div>
<p class="sub" role="status">${esc(note)}</p></div>
<div class="card"><h2>Privacy</h2><p>SCOPE works with domain names, session start times and durations. It never keeps full URLs, page content, search queries, form entries or passwords.</p><p class="sub" style="margin-top:8px">Data stays in this browser’s local storage. SCOPE’s code makes no network requests, and the assistant is a rule-based engine on your device, so no browsing data is sent to any AI service. Demo data is generated and never mixed with yours.</p></div>`}
/* Actions */
const act={
src:v=>{A.src=v},rng:v=>{rng=+v},
help:v=>{A.help=A.help.includes(v)?A.help.filter(x=>x!=v):[...A.help,v]},dis:v=>{A.dis.push(v)},
dur:v=>{if(!F.run){F.dur=+v;F.left=F.dur*60;F.msg=""}},
start:()=>{F.end=Date.now()+F.left*1000;F.run=1;F.msg="";F.id=setInterval(tick,500)},
pause:()=>{clearInterval(F.id);F.left=Math.ceil((F.end-Date.now())/1000);F.run=0},
reset:()=>{clearInterval(F.id);F.run=0;F.left=F.dur*60;F.msg=""},
brk:()=>{A.cfg.brk=!A.cfg.brk},trk:()=>{A.cfg.track=!A.cfg.track},theme:v=>{A.cfg.theme=v;th()},
lim:v=>{A.cfg.lim=+v},ret:v=>{A.cfg.ret=+v;const m=Date.now()-A.cfg.ret*DAY;A.mine.S=A.mine.S.filter(s=>s.start>=m)},
addex:()=>{const d=nd($("#ex").value);if(/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(d)){if(!A.cfg.ex.includes(d))A.cfg.ex.push(d);note=""}else note="Enter a valid domain such as example.com."},
rmex:v=>{A.cfg.ex=A.cfg.ex.filter(x=>x!=v)},
exp:()=>{exp=exp?"":JSON.stringify({exportedAt:new Date().toISOString(),settings:A.cfg,focusSessions:A.foc,sessions:A.mine.S},null,1)},
ask2:()=>{conf=1},nc:()=>{conf=0},
clr:()=>{A.mine={S:[],tabs:0};A.foc=[];A.dis=[];A.help=[];chat=[];conf=0;exp="";A.src="mine";note="All browsing data was cleared."},
ask:v=>{if(!v||!v.trim()||busy)return;chat.push({u:v});busy=1;setTimeout(()=>{chat.push({b:providers.local.ask(v)});busy=0;render()},350)},
send:()=>act.ask($("#q").value),
fix:()=>{try{localStorage.removeItem("scope")}catch(e){}location.reload()},
imp:f=>{if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t),a=Array.isArray(j)?j:j.sessions;if(!Array.isArray(a))throw Error("expected a “sessions” list");const S=[];a.slice(0,50000).forEach(s=>{if(!s)return;const d=nd(String(s.domain||"")),st=+new Date(s.start),m=Math.round(((s.end!=null?+new Date(s.end):st+(+s.min||0)*6e4)-st)/6e4);if(d&&st&&m>=1)S.push({domain:d,start:st,min:Math.min(m,480)})});if(!S.length)throw Error("no valid sessions found");A.mine={S,tabs:Math.max(0,+j.openTabs||0)};A.src="mine";note="Imported "+S.length+" sessions."}catch(x){note="Couldn’t import this file: "+x.message}sv();render()},()=>{note="Couldn’t read this file.";render()})}
};
const cp=()=>{const t=$("#xp"),ok=m=>{$("#cp").textContent=m};t.select();try{navigator.clipboard.writeText(t.value).then(()=>ok("Copied"),()=>ok(document.execCommand("copy")?"Copied":"Select the text and copy it"))}catch(e){ok(document.execCommand("copy")?"Copied":"Select the text and copy it")}};
function run(a,v){if(a=="copy")return cp();if(!act[a])return;act[a](v);sv();render()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el&&!/^(SELECT|INPUT)$/.test(el.tagName))run(el.dataset.a,el.dataset.v)});
document.addEventListener("change",e=>{const el=e.target.closest("select[data-a],input[type=file]");if(el)run(el.dataset.a,el.tagName=="SELECT"?el.value:el.files[0])});
document.addEventListener("keydown",e=>{if(e.key=="Enter"){if(e.target.id=="q")run("send");else if(e.target.id=="ex")run("addex")}});
/* Router */
const R={overview:["Overview",vOverview,ic.home],insights:["Insights",vInsights,ic.bulb],activity:["Activity",vActivity,ic.act],focus:["Focus",vFocus,ic.focus],assistant:["Assistant",vAssistant,ic.chat],prefs:["Settings",vPrefs,ic.set]};
function render(){const r=R[location.hash.slice(1)]?location.hash.slice(1):"overview";document.querySelectorAll("nav a").forEach(a=>a.setAttribute("aria-current",a.hash.slice(1)==r?"page":"false"));
let h;try{h=R[r][1]()}catch(e){h=`<div class="card empty"><b>Something went wrong</b><p>${esc(e.message)}</p><button class="btn p" data-a="fix">Reset SCOPE</button></div>`}
$("#main").innerHTML=(warn?'<div class="card sub" role="alert">Settings can’t be saved in this browser, so they will reset when you leave.</div>':"")+h;
if(r=="assistant"&&chat.length){const m=$("#log .msg:last-child");if(m)m.scrollIntoView({block:"nearest"})}}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
th();$("nav").innerHTML='<div class="logo">SCOPE<small>Your browser, understood.</small></div>'+Object.entries(R).map(([k,v])=>`<a href="#${k}">${svg(v[2])}<span>${v[0]}</span></a>`).join("");render();
})();
</script>
